<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurevashop — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #03000a;
      color: #f5f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      background: linear-gradient(180deg, #12082b 0%, #0a0418 100%);
      border: 1px solid rgba(168,85,247,.25);
      border-radius: 20px;
      padding: 40px 28px;
    }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg,#7c3aed 0%,#22d3ee 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 800; color: #fff;
    }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { font-size: 14px; line-height: 1.6; color: #cbb8f5; margin-bottom: 22px; }
    button {
      background: linear-gradient(135deg,#7c3aed 0%,#22d3ee 100%);
      color: #fff; border: none; border-radius: 12px;
      padding: 12px 28px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">A</div>
    <h1>You're offline</h1>
    <p>Aurevashop needs an internet connection for live wallet, orders and marketplace data. Please reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
