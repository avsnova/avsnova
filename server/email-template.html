<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{brand}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;-webkit-font-smoothing:antialiased;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%;">
  <!-- WRAPPER TABLE -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f4f7;">
    <tr>
      <td align="center" style="padding:20px 10px;">
        <!-- EMAIL CONTAINER -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;width:100%;">
          <!-- ============ HEADER ============ -->
          <tr>
            <td style="padding:0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-radius:12px 12px 0 0;">
                <!--[if mso]>
                <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;">
                  <v:fill type="gradient" color="#1a1a2e" color2="#16213e" angle="135"/>
                  <v:textbox style="mso-fit-shape-to-text:true" inset="0,0,0,0">
                <![endif]-->
                <!-- LOGO / BRAND -->
                <tr>
                  <td align="center" style="padding:36px 30px 10px 30px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="font-size:0;line-height:0;padding-right:10px;" valign="middle">
                          <div style="width:36px;height:36px;background-color:#d4af37;border-radius:8px;text-align:center;line-height:36px;font-size:18px;font-weight:bold;color:#1a1a2e;">{{logo_letter}}</div>
                        </td>
                        <td valign="middle">
                          <h1 style="margin:0;font-family:Georgia,'Times New Roman',Times,serif;font-size:28px;font-weight:700;letter-spacing:4px;color:#d4af37;">{{brand}}</h1>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <!-- TAGLINE -->
                <tr>
                  <td align="center" style="padding:0 30px 8px 30px;">
                    <p style="margin:0;font-family:Georgia,'Times New Roman',Times,serif;font-size:13px;letter-spacing:2px;color:#a0a0b8;font-style:italic;">{{tagline}}</p>
                  </td>
                </tr>
                <!-- GOLD SEPARATOR -->
                <tr>
                  <td align="center" style="padding:10px 60px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td style="border-bottom:2px solid #d4af37;font-size:0;line-height:0;">&nbsp;</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <!-- NAVIGATION -->
                <tr>
                  <td align="center" style="padding:10px 30px 28px 30px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        {{nav_links}}
                      </tr>
                    </table>
                  </td>
                </tr>
                <!--[if mso]>
                  </v:textbox>
                </v:rect>
                <![endif]-->
              </table>
            </td>
          </tr>
          <!-- ============ END HEADER ============ -->

          <!-- ============ BODY ============ -->
          <tr>
            <td style="background-color:#ffffff;padding:40px 30px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:16px;line-height:26px;color:#3d3d4e;">
                    <p style="margin:0 0 16px 0;font-size:20px;font-weight:600;color:#1a1a2e;">{{heading}}</p>
                    <div style="color:#555568;">{{body}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- ============ END BODY ============ -->

          <!-- ============ FOOTER ============ -->
          <tr>
            <td style="padding:0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-radius:0 0 12px 12px;">
                <!-- GOLD TOP BORDER -->
                <tr>
                  <td style="padding:0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr><td style="border-top:3px solid #d4af37;font-size:0;line-height:0;">&nbsp;</td></tr>
                    </table>
                  </td>
                </tr>
                <!-- FOOTER NOTE -->
                <tr>
                  <td align="center" style="padding:24px 30px 4px 30px;">
                    <p style="margin:0;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:13px;color:#cbb8f5;line-height:22px;">{{footer_note}}</p>
                  </td>
                </tr>
                <!-- SOCIAL LINKS -->
                <tr>
                  <td align="center" style="padding:16px 30px 12px 30px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        {{social_links}}
                      </tr>
                    </table>
                  </td>
                </tr>
                <!-- CONTACT INFO -->
                <tr>
                  <td align="center" style="padding:12px 30px 6px 30px;">
                    <p style="margin:0;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:13px;color:#a0a0b8;line-height:22px;">
                      <a href="mailto:{{contact_email}}" style="color:#d4af37;text-decoration:none;">{{contact_email}}</a>
                      &nbsp;&nbsp;|&nbsp;&nbsp;
                      <span style="color:#a0a0b8;">{{contact_phone}}</span>
                    </p>
                  </td>
                </tr>
                <!-- DIVIDER -->
                <tr>
                  <td align="center" style="padding:14px 60px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr><td style="border-bottom:1px solid rgba(212,175,55,0.25);font-size:0;line-height:0;">&nbsp;</td></tr>
                    </table>
                  </td>
                </tr>
                <!-- LEGAL / COPYRIGHT -->
                <tr>
                  <td align="center" style="padding:6px 30px 8px 30px;">
                    <p style="margin:0;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:12px;color:#7a7a92;line-height:20px;">
                      &copy; {{year}} {{brand}}. All rights reserved.
                    </p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 30px 8px 30px;">
                    <p style="margin:0;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:12px;color:#7a7a92;line-height:20px;">
                      {{recipient_note}}
                    </p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:4px 30px 28px 30px;">
                    <p style="margin:0;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:12px;color:#7a7a92;line-height:20px;">
                      <a href="{{unsubscribe_link}}" style="color:#d4af37;text-decoration:underline;">Unsubscribe</a>
                      &nbsp;&nbsp;|&nbsp;&nbsp;
                      <a href="{{privacy_url}}" style="color:#d4af37;text-decoration:underline;">Privacy Policy</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- ============ END FOOTER ============ -->
        </table>
        <!-- END EMAIL CONTAINER -->
      </td>
    </tr>
  </table>
  <!-- END WRAPPER -->
</body>
</html>
